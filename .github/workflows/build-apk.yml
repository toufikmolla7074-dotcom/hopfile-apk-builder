name: Build Android APK

on:
  repository_dispatch:
    types: [build-custom-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Template
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # এডিটর থেকে পাঠানো জিপ ফাইল ডাউনলোড করার জন্য ফোল্ডার তৈরি
      - name: Download and Extract Web Assets
        run: |
          mkdir -p www
          curl -L "${{ github.event.client_payload.zip_url }}" -o code.zip
          unzip -o code.zip -d www/
          rm code.zip

      - name: Install Dependencies
        run: npm install

      # ডায়নামিক কনফিগারেশন তৈরি
      - name: Create Dynamic Capacitor Config
        run: |
          echo '{
            "appId": "${{ github.event.client_payload.package_id }}",
            "appName": "${{ github.event.client_payload.app_name }}",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Sync Android Project
        run: |
          npx cap sync android

      - name: Build Android App (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug

      # বিল্ড শেষে APK আর্টফ্যাক্ট সেভ করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
