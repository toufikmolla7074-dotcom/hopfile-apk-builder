name: Build APK from Web Archive

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.client_payload.appName || 'My App' }}
      PACKAGE_ID: ${{ github.event.client_payload.packageId || 'com.example.runner' }}
      VERSION_NAME: ${{ github.event.client_payload.versionName || '1.0.0' }}
      VERSION_CODE: ${{ github.event.client_payload.versionCode || '1' }}
      ZIP_NAME: ${{ github.event.client_payload.zipName || 'web_payload.zip' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK (Licenses Auto-Accept)
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Initialize Android Web-View Wrapper Template
        run: |
          echo "Initializing lightweight Gradle project structure..."
          mkdir -p app/src/main/java/com/example/runner
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          
          echo "org.gradle.java.home=${JAVA_HOME}" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          
          # Creating settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = 'WebRunner'
          include ':app'
          EOF
          
          # Creating build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Fetch and Wrap Website Archive ZIP
        run: |
          echo "Verifying local web workspace ZIP archive inside repository..."
          if [ ! -f "${ZIP_NAME}" ]; then
              echo "ERROR: ${ZIP_NAME} not found in repository!"
              exit 1
          fi
          
          echo "Extracting workspace targets deep into assets folder..."
          unzip -o "${ZIP_NAME}" -d app/src/main/assets/
          
          if [ ! -f app/src/main/assets/index.html ]; then
              echo "index.html not found in assets root. Checking subdirectories..."
              SUBDIR=$(find app/src/main/assets/ -name "index.html" -print -quit | sed 's|/index.html||')
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "app/src/main/assets" ]; then
                  echo "Found index.html in directory: $SUBDIR. Flattening contents..."
                  mv "$SUBDIR"/* app/src/main/assets/
              else
                  echo "WARNING: index.html not found in package payload!"
              fi
          fi

      - name: Generate Native Android Code from app_config.json
        run: |
          cat << 'EOF' > build_assets.py
          import json
          import os

          config_path = "app/src/main/assets/app_config.json"
          config = {}
          if os.path.exists(config_path):
              with open(config_path, "r") as f:
                  config = json.load(f)

          # Extract configurations
          app_name = config.get("appName", os.environ.get("APP_NAME", "My App"))
          package_id = config.get("packageName", os.environ.get("PACKAGE_ID", "com.example.runner"))
          version_name = config.get("versionName", os.environ.get("VERSION_NAME", "1.0.0"))
          version_code = int(config.get("versionCode", os.environ.get("VERSION_CODE", "1")))
          theme_color = config.get("themeColor", "#4F46E5")
          homepage = config.get("homepage", "index.html")
          screen_rotation = config.get("screenRotation", "auto")
          splash_bg_color = config.get("splashBgColor", "#111827")
          splash_duration = int(config.get("splashDuration", 2000))

          # Dynamic Feature Toggles
          php_support = config.get("phpSupport", True)
          database_enabled = config.get("databaseEnabled", True)
          camera_enabled = config.get("cameraEnabled", True)
          notifications_enabled = config.get("notificationsEnabled", True)
          local_storage_enabled = config.get("localStorageEnabled", True)
          fullscreen_enabled = config.get("fullscreenEnabled", True)
          autoplay_enabled = config.get("autoplayEnabled", True)
          microphone_enabled = config.get("microphoneEnabled", True)
          hide_title_bar = config.get("hideTitleBar", True)
          swipe_refresh_enabled = config.get("swipeRefreshEnabled", True)
          long_press_enabled = config.get("longPressEnabled", True)
          loading_ui_enabled = config.get("loadingUIEnabled", True)
          pc_mode_enabled = config.get("pcModeEnabled", False)
          zoom_enabled = config.get("zoomEnabled", True)
          has_custom_splash = config.get("hasCustomSplash", False)

          # Write app/build.gradle
          app_build_gradle = f"""
          apply plugin: 'com.android.application'
          android {{
              namespace 'com.example.runner'
              compileSdk 33
              defaultConfig {{
                  applicationId "{package_id}"
                  minSdk 24
                  targetSdk 33
                  versionCode {version_code}
                  versionName "{version_name}"
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }}
              buildTypes {{
                  release {{
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }}
              }}
          }}
          dependencies {{
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.9.0'
          }}
          """
          with open("app/build.gradle", "w") as f:
              f.write(app_build_gradle.strip())

          # Write colors.xml
          colors_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">{theme_color}</color>
              <color name="colorPrimaryDark">{theme_color}</color>
              <color name="colorAccent">{theme_color}</color>
              <color name="splashBg">{splash_bg_color}</color>
          </resources>
          """
          with open("app/src/main/res/values/colors.xml", "w") as f:
              f.write(colors_xml.strip())

          # Write styles.xml
          styles_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="SplashTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/splashBg</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>
          </resources>
          """
          with open("app/src/main/res/values/styles.xml", "w") as f:
              f.write(styles_xml.strip())

          # Write activity_splash.xml
          splash_icon_visibility = "visible" if has_custom_splash else "gone"
          activity_splash_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/splashBg">
              <ImageView
                  android:id="@+id/splash_logo"
                  android:layout_width="160dp"
                  android:layout_height="160dp"
                  android:layout_centerInParent="true"
                  android:src="@drawable/splash_icon"
                  android:visibility="{splash_icon_visibility}" />
          </RelativeLayout>
          """
          with open("app/src/main/res/layout/activity_splash.xml", "w") as f:
              f.write(activity_splash_xml.strip())

          # Write activity_main.xml with progress bar and SwipeRefresh wrap configurations
          loading_progress_bar = ""
          if loading_ui_enabled:
              loading_progress_bar = """<ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="6dp"
                  android:layout_alignParentTop="true"
                  android:progressDrawable="@android:drawable/progress_horizontal"
                  android:visibility="gone" />"""

          swipe_refresh_layout_start = ""
          swipe_refresh_layout_end = ""
          if swipe_refresh_enabled:
              swipe_refresh_layout_start = """<androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefreshLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/progressBar">"""
              swipe_refresh_layout_end = "</androidx.swiperefreshlayout.widget.SwipeRefreshLayout>"

          activity_main_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              {loading_progress_bar}
              {swipe_refresh_layout_start}
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
              {swipe_refresh_layout_end}
          </RelativeLayout>
          """
          with open("app/src/main/res/layout/activity_main.xml", "w") as f:
              f.write(activity_main_xml.strip())

          # Handle Permissions & App Theme selection based on Hide Actionbar configuration
          camera_permission_manifest = '<uses-permission android:name="android.permission.CAMERA" />' if camera_enabled else ""
          audio_permission_manifest = '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' if microphone_enabled else ""
          notification_permission_manifest = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' if notifications_enabled else ""
          
          theme_name = "AppTheme.NoActionBar" if hide_title_bar or fullscreen_enabled else "AppTheme"
          
          # Rotation preference mapping
          orientation_mode = "unspecified"
          if screen_rotation == "portrait":
              orientation_mode = "portrait"
          elif screen_rotation == "landscape":
              orientation_mode = "landscape"

          # Write AndroidManifest.xml
          android_manifest_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              {camera_permission_manifest}
              {audio_permission_manifest}
              {notification_permission_manifest}
              
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/{theme_name}">
                  
                  <activity
                      android:name="com.example.runner.SplashActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme"
                      android:screenOrientation="{orientation_mode}">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.example.runner.MainActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="{orientation_mode}">
                  </activity>
              </application>
          </manifest>
          """
          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(android_manifest_xml.strip())

          # Write SplashActivity.java
          splash_activity_java = f"""package com.example.runner;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;

          public class SplashActivity extends Activity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  
                  new Handler().postDelayed(new Runnable() {{
                      @Override
                      public void run() {{
                          Intent intent = new Intent(SplashActivity.this, MainActivity.class);
                          startActivity(intent);
                          finish();
                      }}
                  }}, {splash_duration});
              }}
          }}
          """
          with open("app/src/main/java/com/example/runner/SplashActivity.java", "w") as f:
              f.write(splash_activity_java.strip())

          # Generate MainActivity.java with native web implementations
          swipe_import_block = "import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;" if swipe_refresh_enabled else ""
          swipe_declaration_block = "private SwipeRefreshLayout mSwipeRefresh;" if swipe_refresh_enabled else ""
          progress_declaration_block = "private ProgressBar mProgress;" if loading_ui_enabled else ""
          
          progress_init_block = "mProgress = findViewById(R.id.progressBar);" if loading_ui_enabled else ""
          progress_update_block = """if (mProgress != null) {
              mProgress.setProgress(newProgress);
              if (newProgress == 100) {
                  mProgress.setVisibility(View.GONE);
              } else {
                  mProgress.setVisibility(View.VISIBLE);
              }
          }""" if loading_ui_enabled else ""

          fullscreen_block = ""
          if fullscreen_enabled:
              fullscreen_block = """requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                  getWindow().setDecorFitsSystemWindows(false);
                  WindowInsetsController controller = getWindow().getInsetsController();
                  if (controller != null) {
                      controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                      controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              } else {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }"""
          elif hide_title_bar:
              fullscreen_block = """requestWindowFeature(Window.FEATURE_NO_TITLE);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);"""

          local_storage_block = ""
          if local_storage_enabled:
              local_storage_block = """webSettings.setDomStorageEnabled(true);
              webSettings.setDatabaseEnabled(true);
              webSettings.setAllowFileAccess(true);
              webSettings.setAllowContentAccess(true);
              webSettings.setAllowFileAccessFromFileURLs(true);
              webSettings.setAllowUniversalAccessFromFileURLs(true);"""

          zoom_block = ""
          if zoom_enabled:
              zoom_block = """webSettings.setSupportZoom(true);
              webSettings.setBuiltInZoomControls(true);
              webSettings.setDisplayZoomControls(false);"""

          autoplay_ua_block = ""
          if autoplay_enabled:
              autoplay_ua_block += "webSettings.setMediaPlaybackRequiresUserGesture(false);\n"
          if pc_mode_enabled:
              autoplay_ua_block += """webSettings.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36");
              webSettings.setUseWideViewPort(true);
              webSettings.setLoadWithOverviewMode(true);"""

          swipe_refresh_code_block = ""
          swipe_refresh_stop_code_block = ""
          if swipe_refresh_enabled:
              swipe_refresh_code_block = """mSwipeRefresh = findViewById(R.id.swipeRefreshLayout);
              mSwipeRefresh.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() {
                  @Override
                  public void onRefresh() {
                      mWebView.reload();
                  }
              });"""
              swipe_refresh_stop_code_block = """if (mSwipeRefresh != null) {
                  mSwipeRefresh.setRefreshing(false);
              }"""

          long_press_code_block = ""
          if not long_press_enabled:
              long_press_code_block = """mWebView.setOnLongClickListener(new View.OnLongClickListener() {
                  @Override
                  public boolean onLongClick(View v) {
                      return true;
                  }
              });
              mWebView.setLongClickable(false);"""

          download_manager_block = """mWebView.setDownloadListener(new DownloadListener() {
              @Override
              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                  request.setMimeType(mimetype);
                  String fileName = URLUtil.guessFileName(url, contentDisposition, mimetype);
                  request.setTitle(fileName);
                  request.setDescription("Downloading target assets...");
                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                  if (dm != null) {
                      dm.enqueue(request);
                      Toast.makeText(MainActivity.this, "Download started...", Toast.LENGTH_SHORT).show();
                  }
              }
          });"""

          permission_manager_block = """ArrayList<String> permissions = new ArrayList<>();
          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
              permissions.add("android.permission.POST_NOTIFICATIONS");
          }
          """
          if camera_enabled:
              permission_manager_block += 'permissions.add(Manifest.permission.CAMERA);\n'
          if microphone_enabled:
              permission_manager_block += 'permissions.add(Manifest.permission.RECORD_AUDIO);\n'

          permission_manager_block += """
          if (!permissions.isEmpty() && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
              ArrayList<String> remaining = new ArrayList<>();
              for (String p : permissions) {
                  if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                      remaining.add(p);
                  }
              }
              if (!remaining.isEmpty()) {
                  requestPermissions(remaining.toArray(new String[0]), 101);
              }
          }
          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
              NotificationChannel channel = new NotificationChannel("default", "App Channel", NotificationManager.IMPORTANCE_DEFAULT);
              NotificationManager manager = getSystemService(NotificationManager.class);
              if (manager != null) {
                  manager.createNotificationChannel(channel);
              }
          }
          """

          main_activity_java = f"""package com.example.runner;
          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import java.util.ArrayList;
          {swipe_import_block}

          public class MainActivity extends Activity {{
              private WebView mWebView;
              {swipe_declaration_block}
              {progress_declaration_block}

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  {fullscreen_block}
                  setContentView(R.layout.activity_main);

                  mWebView = findViewById(R.id.webview);
                  {progress_init_block}

                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  {local_storage_block}
                  {zoom_block}
                  {autoplay_ua_block}
                  {swipe_refresh_code_block}
                  {long_press_code_block}
                  {download_manager_block}

                  mWebView.setWebViewClient(new WebViewClient() {{
                      @Override
                      public void onPageFinished(WebView view, String url) {{
                          super.onPageFinished(view, url);
                          {swipe_refresh_stop_code_block}
                      }}
                  }});

                  mWebView.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {{
                          runOnUiThread(new Runnable() {{
                              @Override
                              public void run() {{
                                  request.grant(request.getResources());
                              }}
                          }});
                      }}
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {{
                          super.onProgressChanged(view, newProgress);
                          {progress_update_block}
                      }}
                  }});

                  mWebView.setBackgroundColor(0);
                  {permission_manager_block}
                  mWebView.loadUrl("file:///android_asset/{homepage}");
              }}

              @Override
              public void onBackPressed() {{
                  if (mWebView.canGoBack()) {{
                      mWebView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          """
          with open("app/src/main/java/com/example/runner/MainActivity.java", "w") as f:
              f.write(main_activity_java.strip())
          EOF
          
          python build_assets.py

      - name: Generate Native App Icons and Splash Resources
        run: |
          # Custom launcher icon processing with preinstalled ImageMagick on ubuntu-latest
          ICON_SRC="app/src/main/assets/_app_icon.png"
          if [ -f "$ICON_SRC" ]; then
              echo "Launcher app icon uploaded! Compiling res mipmaps..."
              mkdir -p app/src/main/res/mipmap-mdpi
              mkdir -p app/src/main/res/mipmap-hdpi
              mkdir -p app/src/main/res/mipmap-xhdpi
              mkdir -p app/src/main/res/mipmap-xxhdpi
              mkdir -p app/src/main/res/mipmap-xxxhdpi
              convert "$ICON_SRC" -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
              convert "$ICON_SRC" -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert "$ICON_SRC" -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert "$ICON_SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert "$ICON_SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
              echo "Using default wrapper launcher icon templates."
              mkdir -p app/src/main/res/mipmap-xxhdpi
              curl -sL "https://raw.githubusercontent.com/android/platform_development/master/apps/Development/res/mipmap-xxhdpi/ic_launcher_android.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          fi

          # Custom Splash Screen Icon processing
          SPLASH_SRC="app/src/main/assets/_splash_icon.png"
          if [ -f "$SPLASH_SRC" ]; then
              echo "Custom splash image uploaded! Compiling drawable resources..."
              convert "$SPLASH_SRC" -resize 512x512 app/src/main/res/drawable/splash_icon.png
          fi

      - name: Write strings.xml resource values
        run: |
          cat << EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.0.2

      - name: Developer Mode Compilation Log Summary
        run: |
          echo "### Generated Android Manifest Settings" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          cat app/src/main/AndroidManifest.xml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Compiled MainActivity.java Source" >> $GITHUB_STEP_SUMMARY
          echo '```java' >> $GITHUB_STEP_SUMMARY
          cat app/src/main/java/com/example/runner/MainActivity.java >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run APK Compile Gradle Task
        run: |
          ./gradlew :app:assembleDebug

      - name: Package APK into ZIP
        run: |
          cd app/build/outputs/apk/debug/
          zip -r app-debug.zip app-debug.apk

      - name: Generate Unique Release Tag
        id: tag_gen
        run: |
          CLEANED_NAME=$(echo "${APP_NAME}" | tr -cd '[:alnum:]_')
          TAG="release-${CLEANED_NAME}-${{ github.run_number }}"
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_gen.outputs.TAG_NAME }}
          name: "Release: ${{ env.APP_NAME }} (v${{ env.VERSION_NAME }})"
          body: |
            Automated Android package build for **${{ env.APP_NAME }}**
            - **Package ID:** `${{ env.PACKAGE_ID }}`
            - **Build ID:** `${{ github.run_number }}`
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary payload zip from git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f "${ZIP_NAME}" || true
          git commit -m "chore: clean up temporary build payload [skip ci]" || true
          git push origin main || git push origin master || true
